<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    :root {
      --chord-color: #1e293b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --chord-color: #f0c896;
      }
    }
    line {
      stroke: var(--chord-color);
    }
    ellipse {
      fill: var(--chord-color);
    }
  </style>

  <!-- 3 strings spanning edge-to-edge -->
  <line x1="1.5" y1="5" x2="22.5" y2="5" stroke-width="2.2" stroke-linecap="round" />
  <line x1="1.5" y1="12" x2="22.5" y2="12" stroke-width="2.2" stroke-linecap="round" />
  <line x1="1.5" y1="19" x2="22.5" y2="19" stroke-width="2.2" stroke-linecap="round" />

  <!-- 3 stacked chord noteheads filling vertical height -->
  <ellipse cx="12" cy="5" rx="4.5" ry="2.7" transform="rotate(-20 12 5)" />
  <ellipse cx="12" cy="12" rx="4.5" ry="2.7" transform="rotate(-20 12 12)" />
  <ellipse cx="12" cy="19" rx="4.5" ry="2.7" transform="rotate(-20 12 19)" />
</svg>